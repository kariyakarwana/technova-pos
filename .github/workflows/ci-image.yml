name: Frontend CI and Image

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BUILD_API_URL: ${{ vars.PRODUCTION_API_URL || 'http://localhost:8080/api/v1' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Test deployment authorization
        run: node --test deploy/check-release-owner.test.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: ${{ env.BUILD_API_URL }}
        run: npm run build

  authorize:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require owner's merge permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: node deploy/check-release-owner.mjs

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, authorize]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image_ref.outputs.image }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate production API URL before publishing
        env:
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          node -e 'const u = new URL(process.env.PRODUCTION_API_URL); if (u.protocol !== "https:" || /^(localhost|127\.|0\.0\.0\.0)/.test(u.hostname)) process.exit(1)'

      - name: Build and publish frontend image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.BUILD_API_URL }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-run-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable image reference
        run: echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
